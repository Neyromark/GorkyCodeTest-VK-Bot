services:
  bot:
    build: .
    container_name: vkbottle_bot
    restart: always
    # Подключаем файл .env из корневой папки
    env_file:
      - .env
    volumes:
      - .:/app
      # Кэш моделей Vosk переживает пересоздание контейнера
      - vosk_models:/root/.cache/vosk
    # Оставляем stdin/tty открытыми для корректной работы логов и остановки контейнера
    stdin_open: true
    tty: true
    ports:
      - "80:80"
    networks:
      - default
      - app-network

volumes:
  vosk_models:
